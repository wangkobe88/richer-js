<meta charset="utf-8">
<title>叙事引擎一次心跳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* ═══ ① 主题 token（dark-first 霓虹）═══ */
:root{
  --bg:#070b14; --bg-2:#0a1120; --panel:#0e1830; --panel-2:#13203c; --panel-3:#0b1326;
  --fg:#e7eef9; --fg-dim:#93a4c3; --fg-faint:#7488ad;
  --line:#1d2b47; --line-2:#2b4066;
  --accent:#2fd8f0; --accent-2:#e879f9;
  --ok:#3ddc97; --warn:#fbbf24; --bad:#fb7185;
  --glow-a:color-mix(in srgb,var(--accent) 42%,transparent);
  --glow-b:color-mix(in srgb,var(--accent-2) 38%,transparent);
  --glow-ok:color-mix(in srgb,var(--ok) 40%,transparent);
  --glow-bad:color-mix(in srgb,var(--bad) 42%,transparent);
  --wire-base:#20304f; --wire-flow:var(--accent);
  --star:#33456b;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef3fb; --bg-2:#e6edf8; --panel:#ffffff; --panel-2:#f3f7fd; --panel-3:#f8fafd;
    --fg:#17253f; --fg-dim:#4c5f82; --fg-faint:#5b6e93;
    --line:#cfdcee; --line-2:#b7cbe2;
    --accent:#0b7fa0; --accent-2:#9333b8;
    --ok:#0e7a4b; --warn:#8a5a00; --bad:#c0271f;
    --glow-a:color-mix(in srgb,var(--accent) 22%,transparent);
    --glow-b:color-mix(in srgb,var(--accent-2) 20%,transparent);
    --glow-ok:color-mix(in srgb,var(--ok) 22%,transparent);
    --glow-bad:color-mix(in srgb,var(--bad) 22%,transparent);
    --wire-base:#b9cbe0; --star:#a9bcd6;
  }
}
:root[data-theme="light"]{
  --bg:#eef3fb; --bg-2:#e6edf8; --panel:#ffffff; --panel-2:#f3f7fd; --panel-3:#f8fafd;
  --fg:#17253f; --fg-dim:#4c5f82; --fg-faint:#5b6e93;
  --line:#cfdcee; --line-2:#b7cbe2;
  --accent:#0b7fa0; --accent-2:#9333b8;
  --ok:#0e7a4b; --warn:#8a5a00; --bad:#c0271f;
  --glow-a:color-mix(in srgb,var(--accent) 22%,transparent);
  --glow-b:color-mix(in srgb,var(--accent-2) 20%,transparent);
  --glow-ok:color-mix(in srgb,var(--ok) 22%,transparent);
  --glow-bad:color-mix(in srgb,var(--bad) 22%,transparent);
  --wire-base:#b9cbe0; --star:#a9bcd6;
}

/* ═══ ② 壳层 ═══ */
html,body{height:100%}
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--fg);
  overflow:hidden; -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{height:100%; display:flex; flex-direction:column; gap:8px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:10px 12px; box-sizing:border-box}
header{
  flex:0 0 auto; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  padding-bottom:8px; border-bottom:1px solid var(--line);
}
header .brand{font-size:17px; font-weight:700; letter-spacing:.02em}
header .brand em{font-style:normal; color:var(--accent)}
header .tagline{font-size:12px; color:var(--fg-faint); font-family:var(--mono)}
header .chname{margin-left:auto; font-size:12px; color:var(--fg-dim); display:flex; gap:8px; align-items:baseline}
header .chname b{color:var(--accent); font-family:var(--mono); font-weight:600}
#stageWrap{
  flex:1 1 auto; position:relative; min-height:0; border-radius:14px;
  border:1px solid var(--line);
  background:
    radial-gradient(1100px 650px at 72% -12%, var(--glow-a), transparent 62%),
    radial-gradient(880px 560px at 12% 112%, var(--glow-b), transparent 58%),
    var(--bg-2);
  overflow:hidden;
}
#stageWrap::after{
  content:''; position:absolute; inset:0; pointer-events:none; opacity:.6;
  background-image:
    radial-gradient(1.4px 1.4px at 9% 22%, var(--star), transparent 100%),
    radial-gradient(1px 1px at 22% 68%, var(--star), transparent 100%),
    radial-gradient(1.6px 1.6px at 31% 14%, var(--star), transparent 100%),
    radial-gradient(1px 1px at 44% 82%, var(--star), transparent 100%),
    radial-gradient(1.3px 1.3px at 56% 34%, var(--star), transparent 100%),
    radial-gradient(1px 1px at 66% 74%, var(--star), transparent 100%),
    radial-gradient(1.5px 1.5px at 78% 18%, var(--star), transparent 100%),
    radial-gradient(1px 1px at 86% 58%, var(--star), transparent 100%),
    radial-gradient(1.2px 1.2px at 94% 34%, var(--star), transparent 100%),
    radial-gradient(1px 1px at 15% 44%, var(--star), transparent 100%);
  animation:twinkle 5.5s ease-in-out infinite alternate;
}
#stageInner{
  position:absolute; left:50%; top:50%; width:960px; height:540px;
  margin:-270px 0 0 -480px; transform-origin:center center;
}
#wires{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:1}
.scene{position:absolute; inset:0; z-index:2}
#subBar{flex:0 0 auto; display:flex; align-items:baseline; gap:12px; min-height:40px}
#chEyebrow{
  flex:0 0 auto; font-family:var(--mono); font-size:11px; letter-spacing:.14em;
  color:var(--accent); text-transform:uppercase; white-space:nowrap;
}
#subText{font-size:14.5px; line-height:1.5; color:var(--fg-dim); min-width:0}
#timeline{flex:0 0 auto; display:flex; gap:3px; height:34px; align-items:stretch}
.tl-seg{
  flex:1 1 auto; position:relative; border:1px solid var(--line); border-radius:6px;
  background:var(--panel-3); cursor:pointer; overflow:hidden; padding:0;
  display:flex; align-items:center; justify-content:center; gap:4px;
  transition:border-color .3s, background .3s;
}
.tl-seg:hover{border-color:var(--line-2)}
.tl-seg .fill{
  position:absolute; inset:0; width:0%; background:linear-gradient(90deg,var(--glow-a),color-mix(in srgb,var(--accent) 24%,transparent));
  border-radius:5px; transition:width .2s linear;
}
.tl-seg .lbl{
  position:relative; font-family:var(--mono); font-size:10px; color:var(--fg-faint);
  white-space:nowrap; transition:color .3s;
}
.tl-seg.cur{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.tl-seg.cur .lbl{color:var(--fg)}
.tl-seg.done .lbl{color:var(--fg-dim)}
#controls{flex:0 0 auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.btn{
  appearance:none; border:1px solid var(--line); background:var(--panel); color:var(--fg-dim);
  font-family:var(--mono); font-size:12.5px; border-radius:8px; padding:8px 13px; cursor:pointer;
  transition:border-color .25s, color .25s, background .25s;
}
.btn:hover{border-color:var(--line-2); color:var(--fg)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn.primary{border-color:color-mix(in srgb,var(--accent) 55%,transparent); color:var(--accent); min-width:74px}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.btn.active{border-color:var(--accent); color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
#speedGroup{display:flex; gap:0; margin-left:auto}
#speedGroup .btn{border-radius:0; margin-left:-1px}
#speedGroup .btn:first-child{border-radius:8px 0 0 8px; margin-left:0}
#speedGroup .btn:last-child{border-radius:0 8px 8px 0}

/* ═══ ③ 通用组件 ═══ */
.node{
  position:absolute; left:var(--x); top:var(--y); width:var(--w,180px);
  background:color-mix(in srgb,var(--panel) 88%,transparent);
  border:1px solid var(--line); border-radius:12px; padding:10px 12px;
  box-sizing:border-box; z-index:2;
  transition:border-color .45s, box-shadow .45s, opacity .5s, transform .5s;
}
.node .nt{font-size:13px; font-weight:700; letter-spacing:.01em; margin-bottom:3px}
.node .nd{font-size:11px; line-height:1.45; color:var(--fg-dim)}
.node .nm{font-family:var(--mono); font-size:10px; color:var(--fg-faint); margin-top:4px}
.node.lit{border-color:color-mix(in srgb,var(--accent) 65%,transparent); box-shadow:0 0 16px var(--glow-a)}
.node.lit-ok{border-color:color-mix(in srgb,var(--ok) 60%,transparent); box-shadow:0 0 14px var(--glow-ok)}
.node.lit-bad{border-color:color-mix(in srgb,var(--bad) 65%,transparent); box-shadow:0 0 14px var(--glow-bad)}
.node.hot .nt{color:var(--accent)}
.node[data-tip]{cursor:help}
.badge{
  display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-size:10px;
  border:1px solid var(--line-2); border-radius:5px; padding:2px 6px; color:var(--fg-dim);
  background:var(--panel-2); white-space:nowrap;
}
.badge.b-a{border-color:color-mix(in srgb,var(--accent) 50%,transparent); color:var(--accent)}
.badge.b-ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent); color:var(--ok)}
.badge.b-bad{border-color:color-mix(in srgb,var(--bad) 55%,transparent); color:var(--bad)}
.badge.b-warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent); color:var(--warn)}
.badge.b-mag{border-color:color-mix(in srgb,var(--accent-2) 55%,transparent); color:var(--accent-2)}
.chip{display:inline-block; font-family:var(--mono); font-size:10px; color:var(--fg-faint); margin-right:5px}
[data-a]{opacity:0; transform:translateY(12px) scale(.97); transition:opacity .55s ease, transform .55s cubic-bezier(.2,.85,.25,1)}
[data-a].on{opacity:1; transform:none}
.stamp{
  position:absolute; font-family:var(--mono); font-weight:800; font-size:15px; letter-spacing:.1em;
  color:var(--bad); border:2.5px solid currentColor; border-radius:8px; padding:4px 10px;
  transform:rotate(-8deg); background:color-mix(in srgb,var(--bg) 60%,transparent);
  z-index:5; pointer-events:none;
}
.stamp.ok{color:var(--ok)}
.stamp.mag{color:var(--accent-2)}
.stamp.hit{animation:stampIn .5s cubic-bezier(.2,1.6,.4,1) both}
.ghost{
  border-style:dashed; opacity:.5;
  border-color:color-mix(in srgb,var(--accent-2) 60%,transparent);
}
.ghost .nt, .ghost .nd{color:var(--fg-dim)}
.branch-tag{
  position:absolute; top:-9px; right:10px; font-family:var(--mono); font-size:9px; letter-spacing:.12em;
  color:var(--accent-2); background:var(--bg-2); border:1px dashed color-mix(in srgb,var(--accent-2) 60%,transparent);
  border-radius:4px; padding:1px 6px; z-index:6;
}
.prob{margin:6px 0 2px}
.prob .pr-l{display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; color:var(--fg-faint); margin-bottom:3px}
.prob .pr-l b{color:var(--fg-dim); font-weight:600}
.prob .pr-t{height:7px; border-radius:4px; background:var(--panel-3); border:1px solid var(--line); overflow:hidden}
.prob .pr-f{height:100%; width:0%; border-radius:4px; background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--accent-2))); transition:width 1s cubic-bezier(.25,.8,.3,1)}
.prob .pr-f.ok{background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 70%,var(--accent)))}
.prob .pr-f.mag{background:linear-gradient(90deg,var(--accent-2),color-mix(in srgb,var(--accent-2) 70%,var(--accent)))}
.prob .pr-t .thresh{position:absolute}
.big{font-family:var(--mono); font-weight:700; font-size:30px; letter-spacing:.02em; line-height:1}
.big.ok{color:var(--ok)} .big.bad{color:var(--bad)} .big.acc{color:var(--accent)} .big.mag{color:var(--accent-2)}
.mono{font-family:var(--mono)}
.dim{color:var(--fg-dim)} .faint{color:var(--fg-faint)}
.acc{color:var(--accent)} .okc{color:var(--ok)} .badc{color:var(--bad)} .magc{color:var(--accent-2)} .warnc{color:var(--warn)}
.glow-t{text-shadow:0 0 14px var(--glow-a)}
.hr{height:1px; background:var(--line); margin:7px 0; border:0}
.pt{
  position:absolute; width:5px; height:5px; border-radius:50%; z-index:4; pointer-events:none;
  background:var(--accent); box-shadow:0 0 8px var(--glow-a); left:0; top:0; opacity:.9;
}
.pt.mag{background:var(--accent-2); box-shadow:0 0 8px var(--glow-b)}
.wire-base{fill:none; stroke:var(--wire-base); stroke-width:1.6}
.wire-base.mag{stroke:color-mix(in srgb,var(--accent-2) 45%,var(--wire-base))}
.wire-flow{fill:none; stroke:var(--wire-flow); stroke-width:2; stroke-linecap:round;
  stroke-dasharray:9 27; opacity:0; transition:opacity .5s; filter:drop-shadow(0 0 4px var(--glow-a))}
.wire-flow.mag{stroke:var(--accent-2); filter:drop-shadow(0 0 4px var(--glow-b))}
.wire-flow.run{opacity:.95; animation:flow 1.1s linear infinite}
.wire-flow.once{opacity:.95; animation:flowOnce 1s linear 1}
.card-list{display:flex; flex-direction:column; gap:6px}
.mini{font-size:10.5px; line-height:1.5; color:var(--fg-dim)}
.door{
  position:absolute; background:var(--panel-2); border:1.5px solid var(--line-2); border-radius:8px;
  font-family:var(--mono); font-size:10.5px; color:var(--fg-dim); padding:6px 9px; z-index:3;
  transition:border-color .4s, box-shadow .4s, color .4s, opacity .5s, transform .5s;
}
.door.open{border-color:color-mix(in srgb,var(--ok) 60%,transparent); color:var(--ok); box-shadow:0 0 12px var(--glow-ok)}
.klabel{
  position:absolute; font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--fg-faint);
  text-transform:uppercase; z-index:3; transition:color .4s;
}
.klabel.acc{color:var(--accent)}
/* ═══ ④ 各章场景 ═══ */
/* ch1 代币卡 */
.tokcard{--w:330px; padding:16px 18px}
.tokcard .tk-sym{font-family:var(--mono); font-weight:800; font-size:30px; color:var(--accent); text-shadow:0 0 18px var(--glow-a)}
.tokcard .tk-row{display:flex; align-items:center; gap:7px; margin-top:7px; font-family:var(--mono); font-size:11px; color:var(--fg-dim); min-width:0}
.tokcard .tk-row .u{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:250px}
.urlbox{
  position:absolute; --w:400px; background:color-mix(in srgb,var(--panel) 88%,transparent);
  border:1px solid var(--line); border-radius:10px; padding:9px 12px; box-sizing:border-box;
}
.urlbox .ub-h{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; color:var(--fg-faint); text-transform:uppercase; margin-bottom:4px}
.urlbox .ub-r{display:flex; gap:8px; align-items:baseline; font-family:var(--mono); font-size:11px; margin-top:4px; transition:color .4s, opacity .4s}
.urlbox .ub-r .k{color:var(--fg-faint); flex:0 0 58px}
.urlbox .ub-r .v{color:var(--fg-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.urlbox .ub-r.on .v{color:var(--accent)}
.qmark{
  position:absolute; font-size:19px; font-weight:700; color:var(--accent-2); z-index:5;
  text-shadow:0 0 16px var(--glow-b); transition:opacity .6s, transform .6s;
}
/* ch2/ch12 DB 圆柱 */
.dbcyl{
  position:absolute; --w:210px; display:flex; flex-direction:column; align-items:center; z-index:2;
  transition:opacity .5s, transform .5s;
}
.dbcyl .cyl{
  width:120px; height:104px; position:relative;
  background:linear-gradient(180deg, color-mix(in srgb,var(--panel-2) 92%,transparent), var(--panel-3));
  border:1.5px solid var(--line-2); border-radius:14px/26px;
}
.dbcyl .cyl::before{
  content:''; position:absolute; left:-1.5px; right:-1.5px; top:-11px; height:24px;
  background:var(--panel-2); border:1.5px solid var(--line-2); border-radius:50%;
}
.dbcyl .db-n{font-family:var(--mono); font-size:11px; color:var(--fg-dim); margin-top:10px}
.dbcyl .db-s{font-family:var(--mono); font-size:9.5px; color:var(--fg-faint); margin-top:2px}
.dbcyl.lit .cyl{border-color:color-mix(in srgb,var(--accent) 60%,transparent); box-shadow:0 0 22px var(--glow-a)}
/* ch3 桶与平台 */
.bucket{--w:200px; min-height:96px}
.bucket .bk-i{display:flex; flex-wrap:wrap; gap:4px; margin-top:6px}
.platch{
  display:inline-block; font-family:var(--mono); font-size:9.5px; border:1px solid var(--line);
  border-radius:4px; padding:2px 5px; color:var(--fg-faint); background:var(--panel-3);
  transition:color .35s, border-color .35s, box-shadow .35s;
}
.platch.on{color:var(--accent); border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.platch.off{opacity:.42; text-decoration:line-through}
.chainrow{display:flex; gap:3px; flex-wrap:nowrap; margin-top:6px}
.chainrow .platch{transition-delay:0s}
/* ch4/ch7 门题卡 */
.gatecard{--w:250px}
.gatecard .gc-h{display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--accent); text-transform:uppercase}
.skipgrid{position:absolute; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:5px; z-index:2}
.skipgrid .platch{font-size:9px; text-align:center; position:relative}
.skipgrid .platch.sk{opacity:.38}
/* ch5 泳道 */
.lane{
  position:absolute; left:70px; right:90px; height:44px; background:var(--panel-3);
  border:1px solid var(--line); border-radius:9px; z-index:2; display:flex; align-items:center;
  padding:0 12px; gap:10px; box-sizing:border-box;
  transition:border-color .4s, opacity .5s;
}
.lane .ln-n{font-family:var(--mono); font-size:10px; color:var(--fg-faint); flex:0 0 auto; width:26px}
.lane .ln-t{font-size:12px; font-weight:600; flex:0 0 178px}
.lane .ln-p{flex:1 1 auto; height:7px; border-radius:4px; background:var(--panel); border:1px solid var(--line); overflow:hidden}
.lane .ln-p i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width 1.4s cubic-bezier(.3,.7,.3,1)}
.lane .ln-s{font-family:var(--mono); font-size:10px; color:var(--fg-faint); flex:0 0 auto; transition:color .4s}
.lane.done{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.lane.done .ln-s{color:var(--ok)}
.lane.idle{opacity:.4}
/* ch6 规则墙 */
.rwall{position:absolute; display:grid; grid-template-columns:repeat(4,1fr); gap:7px; z-index:2}
.brick{
  background:var(--panel-3); border:1px solid var(--line); border-radius:8px; padding:7px 8px;
  transition:border-color .35s, box-shadow .35s, opacity .5s;
}
.brick .bk-c{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--fg-dim)}
.brick .bk-d{font-size:9.8px; line-height:1.35; color:var(--fg-faint); margin-top:2px}
.brick.pass{border-color:color-mix(in srgb,var(--ok) 50%,transparent); box-shadow:0 0 9px var(--glow-ok)}
.brick.pass .bk-c{color:var(--ok)}
.brick.fail{border-color:color-mix(in srgb,var(--bad) 60%,transparent); box-shadow:0 0 12px var(--glow-bad)}
.brick.fail .bk-c{color:var(--bad)}
.brick.hot{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.wallscan{
  position:absolute; width:2px; height:0; background:linear-gradient(180deg,transparent,var(--accent),transparent);
  box-shadow:0 0 14px 3px var(--glow-a); z-index:4; opacity:0;
}
/* ch8 路由 */
.router{
  --w:230px; display:flex; flex-direction:column; align-items:center; text-align:center; padding:14px;
}
.router .rt-c{width:52px; height:52px; border-radius:50%; border:2px solid var(--line-2); position:relative; margin-bottom:8px;
  background:radial-gradient(circle at 50% 40%, var(--panel-2), var(--panel-3)); transition:border-color .5s, box-shadow .5s}
.router .rt-c::after{content:''; position:absolute; inset:16px; border-radius:50%; background:var(--accent); opacity:.85; box-shadow:0 0 16px var(--glow-a); transition:opacity .5s}
.router.lit .rt-c{border-color:var(--accent); box-shadow:0 0 20px var(--glow-a)}
/* ch9 题卡轮播 */
.qstage{position:absolute; inset:0; z-index:2}
.qcard{
  position:absolute; --w:300px; transition:opacity .6s, transform .6s;
}
.qcard.qout{opacity:0; transform:translateX(-26px) scale(.96); pointer-events:none}
.qcard.qin{opacity:0; transform:translateX(26px) scale(.96)}

<script>
'use strict';
/* ═══════════ ② dom 工厂 ═══════════ */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE = () => matchMedia('(max-width:640px)').matches;
const HOVERABLE = matchMedia('(hover:hover)').matches;
function el(tag, cls, html){
  const e=document.createElement(tag);
  if(cls) e.className=cls;
  if(html!=null) e.innerHTML=html;
  return e;
}
/* 画布节点：绝对定位 + 入场动画（data-a/.on） */
function node(S, o){
  const n=el('div','node'+(o.cls?' '+o.cls:''));
  n.style.setProperty('--x',(o.x||0)+'px');
  n.style.setProperty('--y',(o.y||0)+'px');
  if(o.w) n.style.setProperty('--w',o.w+'px');
  n.innerHTML=(o.t?`<div class="nt">${o.t}</div>`:'')
    +(o.d?`<div class="nd">${o.d}</div>`:'')
    +(o.m?`<div class="nm">${o.m}</div>`:'');
  if(o.tip) n.dataset.tip=o.tip;
  if(o.detail) n.dataset.detail=o.detail;
  if(o.still==null || !o.still) n.setAttribute('data-a','');
  S.root.appendChild(n);
  return n;
}
function klabel(S, x, y, text, w){
  const k=el('div','klabel'+(w?' acc':''), text);
  k.style.left=x+'px'; k.style.top=y+'px';
  S.root.appendChild(k); return k;
}
function stampAt(S, x, y, text, cls){
  const st=el('div','stamp '+(cls||''), text);
  st.style.left=x+'px'; st.style.top=y+'px';
  S.root.appendChild(st); return st;
}
function branchTag(n){ n.appendChild(el('div','branch-tag','分支')); }
/* SVG 走线（桌面画布模式） */
function wire(S, a, b, opts={}){
  const NS='http://www.w3.org/2000/svg';
  const mk=t=>document.createElementNS(NS,t);
  const flow=mk('path'); flow.setAttribute('class','wire-flow'+(opts.mag?' mag':''));
  if(!MOBILE()){
    const p=mk('path'); p.setAttribute('class','wire-base'+(opts.mag?' mag':''));
    const ax=a.offsetLeft+(opts.aRight==null||opts.aRight?a.offsetWidth:0);
    const ay=a.offsetTop+a.offsetHeight/2+(opts.ady||0);
    const bx=b.offsetLeft+(opts.bLeft==null||opts.bLeft?0:b.offsetWidth);
    const by=b.offsetTop+b.offsetHeight/2+(opts.bdy||0);
    const k=opts.curv==null?46:opts.curv;
    const d=`M ${ax} ${ay} C ${ax+k} ${ay}, ${bx-k} ${by}, ${bx} ${by}`;
    p.setAttribute('d',d); flow.setAttribute('d',d);
    $('#wires').appendChild(p); $('#wires').appendChild(flow);
  }
  return flow;
}

/* ═══════════ ③ FX（全部读场景时钟，暂停即停） ═══════════ */
const FX = {
  parts: [], counts: [],
  flow(S, path, n, mag){
    if(REDUCED || MOBILE() || !path) return;
    const len=path.getTotalLength();
    for(let i=0;i<n;i++){
      const p=el('span','pt'+(mag?' mag':''));
      S.root.appendChild(p);
      this.parts.push({el:p, path, len, off:i/n+Math.random()*.05, spd:.5+Math.random()*.3});
    }
  },
  count(S, e, to, dur, fmt){
    const toStr=v=>fmt?fmt(v):(Math.abs(to%1)>0? v.toFixed(1): String(Math.round(v)));
    e.textContent=toStr(0);
    this.counts.push({e, to, dur, t0:Player.t, toStr});
  },
  settle(){ for(const c of this.counts){ c.e.textContent=c.toStr(c.to); } this.counts=[]; },
  frame(t){
    for(const p of this.parts){
      const u=(t*p.spd+p.off)%1;
      const pt=p.path.getPointAtLength(u*p.len);
      p.el.style.transform=`translate(${pt.x-2.5}px,${pt.y-2.5}px)`;
    }
    if(this.counts.length){
      const keep=[];
      for(const c of this.counts){
        const u=Math.min(1,(t-c.t0)/c.dur);
        const v=c.to*(1-Math.pow(1-u,3));
        c.e.textContent=c.toStr(v);
        if(u<1) keep.push(c);
      }
      this.counts=keep;
    }
  },
  reset(){ this.parts.forEach(p=>p.el.remove()); this.parts=[]; this.counts=[]; },
};

/* ═══════════ ④ Player（单 rAF 主时钟 + 章节状态机 + cue 表） ═══════════ */
const Player = {
  idx:0, t:0, playing:false, speed:1, cues:[], scene:null, last:0,
  get chapter(){ return C.chapters[this.idx]; },
  seekToChapter(i){
    this.idx=Math.max(0,Math.min(C.chapters.length-1,i));
    this.buildScene();
    const n=this.idx;
    $('#chNum').textContent=String(n+1).padStart(2,'0')+'/13';
    $('#chTitle').textContent=C.chapters[n].t;
    $('#chEyebrow').textContent='CH '+String(n+1).padStart(2,'0')+' · '+C.chapters[n].e;
    $('#subText').textContent=C.chapters[n].sub;
    $$('.tl-seg').forEach((s,j)=>{
      s.classList.toggle('cur',j===n);
      s.classList.toggle('done',j<n);
      s.querySelector('.fill').style.width='0%';
    });
    try{ history.replaceState(null,'','#c'+(n+1)); }catch(_){}
  },
  buildScene(){
    FX.reset();
    $$('#wires *').forEach(x=>x.remove());
    if(this.scene) this.scene.remove();
    const root=el('div','scene'+(REDUCED?' instant':''));
    $('#stageInner').appendChild(root);
    this.scene=root;
    const S={root, cues:[]};
    S.cues=SCENES[this.idx](S)||S.cues;
    this.cues=S.cues;
    this.t=0;
    if(REDUCED) this.fire(true);
  },
  fire(all){
    for(const c of this.cues){
      if(!c.fired && (all || this.t>=c.t)){ c.fired=true; c.fn(!!all); }
    }
  },
  play(){
    this.playing=true; this.last=0;
    $('#btnPlay').innerHTML='❚❚ 暂停';
    document.body.classList.remove('paused');
  },
  pause(){
    this.playing=false;
    $('#btnPlay').innerHTML='▶ 播放';
    document.body.classList.add('paused');
  },
  toggle(){ this.playing?this.pause():this.play(); },
  replay(){ this.buildScene(); if(REDUCED) this.fire(true); },
};
function loop(now){
  const dt=Player.last?Math.min((now-Player.last)/1000,.05):0;
  Player.last=now;
  if(Player.playing){
    Player.t+=dt*Player.speed;
    const ch=Player.chapter;
    if(Player.t>=ch.d){
      if(Player.idx<C.chapters.length-1){ Player.seekToChapter(Player.idx+1); }
      else { Player.t=ch.d; Player.pause(); Player.fire(true); }
    }
  }
  Player.fire(false);
  const seg=document.querySelector('.tl-seg.cur .fill');
  if(seg) seg.style.width=Math.min(100,Player.t/Player.chapter.d*100)+'%';
  FX.frame(Player.t);
  requestAnimationFrame(loop);
}
function fitStage(){
  if(MOBILE()){ $('#stageInner').style.transform='none'; return; }
  const w=$('#stageWrap');
  const s=Math.min(w.clientWidth/960, w.clientHeight/540);
  $('#stageInner').style.transform=`scale(${s})`;
}
</script>

<script>
'use strict';
/* ═══════════ ⑥ Panel（tooltip + 详解抽屉） ═══════════ */
const drawer=$('#drawer');
let drawerWasPlaying=false;
function openDrawer(key, title){
  if(!C.details[key]) return;
  drawerWasPlaying=Player.playing;
  if(drawerWasPlaying) Player.pause();
  $('#dwTitle').textContent=title||'详解';
  $('#dwBody').innerHTML=C.details[key];
  if(!drawer.classList.contains('open')) drawer.classList.add('open');
  drawer.setAttribute('aria-hidden','false');
}
function closeDrawer(){
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden','true');
  if(drawerWasPlaying){ drawerWasPlaying=false; Player.play(); }
}
document.addEventListener('click',e=>{
  const x=e.target.closest('#dwClose');
  if(x){ closeDrawer(); return; }
  if(e.target.closest('#drawer')) return;
  const d=e.target.closest('[data-detail]');
  if(d){
    const t=d.querySelector('.nt,.ln-t,.rc-t');
    openDrawer(d.dataset.detail, t?t.textContent.trim():'详解');
  }
});
const tipEl=$('#tooltip');
if(HOVERABLE){
  document.addEventListener('pointermove',e=>{
    const t=e.target.closest('[data-tip]');
    if(t && t.dataset.tip && !drawer.classList.contains('open')){
      tipEl.innerHTML=t.dataset.tip;
      tipEl.classList.add('show');
      const r=tipEl.getBoundingClientRect();
      tipEl.style.left=Math.max(8,Math.min(e.clientX+14, innerWidth-r.width-12))+'px';
      tipEl.style.top=Math.min(e.clientY+16, innerHeight-r.height-12)+'px';
    } else tipEl.classList.remove('show');
  });
}

/* ═══════════ ⑦ Controls ═══════════ */
const SHORT=['开场','缓存','分桶','语料门','泳道','规则墙','图门','分流','答题','定型','评分','落库','全景'];
(function buildTimeline(){
  const tl=$('#timeline');
  C.chapters.forEach((ch,j)=>{
    const s=el('button','tl-seg');
    s.type='button';
    s.style.flexGrow=String(ch.d);
    s.setAttribute('aria-label','第'+(j+1)+'章 '+ch.t);
    s.innerHTML='<div class="fill"></div><div class="lbl">'+(j+1)+' '+SHORT[j]+'</div>';
    s.addEventListener('click',()=>Player.seekToChapter(j));
    tl.appendChild(s);
  });
})();
$('#btnPlay').addEventListener('click',()=>Player.toggle());
$('#btnPrev').addEventListener('click',()=>Player.seekToChapter(Player.idx-1));
$('#btnNext').addEventListener('click',()=>Player.seekToChapter(Player.idx+1));
$('#btnReplay').addEventListener('click',()=>Player.replay());
$$('.spd').forEach(b=>b.addEventListener('click',()=>{
  Player.speed=+b.dataset.s;
  $$('.spd').forEach(x=>x.classList.toggle('active',x===b));
  try{ localStorage.setItem('hb-speed',b.dataset.s); }catch(_){}
}));
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); Player.toggle(); }
  else if(e.code==='ArrowLeft'){ Player.seekToChapter(Player.idx-1); }
  else if(e.code==='ArrowRight'){ Player.seekToChapter(Player.idx+1); }
  else if(e.code==='Escape'){ closeDrawer(); }
});

/* ═══════════ ⑧ Boot ═══════════ */
new ResizeObserver(fitStage).observe($('#stageWrap'));
let wasMobile=MOBILE();
addEventListener('resize',()=>{
  fitStage();
  if(MOBILE()!==wasMobile){
    wasMobile=MOBILE();
    Player.buildScene();
    if(REDUCED) Player.fire(true);
  }
});
(function boot(){
  fitStage();
  let sp='1';
  try{ sp=localStorage.getItem('hb-speed')||'1'; }catch(_){}
  Player.speed=Math.min(2,Math.max(.75,+sp||1));
  $$('.spd').forEach(b=>b.classList.toggle('active',+b.dataset.s===Player.speed));
  const m=(location.hash||'').match(/^#c(\d+)/);
  Player.seekToChapter(m?Math.min(C.chapters.length-1,Math.max(0,+m[1]-1)):0);
  Player.play();
  requestAnimationFrame(loop);
  addEventListener('hashchange',()=>{
    const n=(location.hash||'').match(/^#c(\d+)/);
    if(n) Player.seekToChapter(Math.min(C.chapters.length-1,Math.max(0,+n[1]-1)));
  });
})();
</script>
