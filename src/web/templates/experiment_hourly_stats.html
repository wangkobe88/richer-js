<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Richer 交易系统 - 统计监控</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/static/css/light-theme.css?v=4.0" rel="stylesheet">
    <link href="/static/css/style.css?v=4.0" rel="stylesheet">
    <link href="/static/css/main.css?v=4.0" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.9);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f4f6;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .table-row:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }

        /* 热度徽章四档 */
        .heat-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .heat-hot {
            background-color: #dc2626;
            color: white;
        }

        .heat-active {
            background-color: #d97706;
            color: white;
        }

        .heat-calm {
            background-color: #3b82f6;
            color: white;
        }

        .heat-cold {
            background-color: transparent;
            color: #6b7280;
            border: 1px dashed #4b5563;
        }

        .heat-unknown {
            background-color: transparent;
            color: #6b7280;
            border: 1px dotted #4b5563;
        }

        .cell-muted {
            color: #6b7280;
        }

        .platform-tag {
            display: inline-block;
            padding: 0.1rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .chart-container {
            position: relative;
            height: 380px;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">
    <div class="min-h-screen">
        <!-- 导航栏 -->
        <nav class="bg-gray-800 border-b border-gray-700">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <div class="flex items-center">
                        <h1 class="text-xl font-bold text-green-400">
                            <a href="/" class="hover:text-green-300 transition-colors">
                                Richer-js Fourmeme Trading
                            </a>
                        </h1>
                        <div class="hidden md:block">
                            <a href="/experiments" class="ml-8 px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-colors">
                                实验列表
                            </a>
                            <a id="link-detail" href="#" class="ml-4 px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-colors">
                                实验详情
                            </a>
                            <a id="link-signal-stats" href="#" class="ml-4 px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-colors">
                                信号统计
                            </a>
                            <a id="link-signals" href="#" class="ml-4 px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-colors">
                                交易信号
                            </a>
                            <a id="link-trades" href="#" class="ml-4 px-3 py-2 rounded-md text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-700 transition-colors">
                                交易记录
                            </a>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span id="cache-indicator" class="text-xs text-gray-500"></span>
                        <button id="refresh-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded-md text-sm font-medium text-white transition-colors">
                            🔄 刷新
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- 主内容区 -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <!-- 加载指示器 -->
            <div id="loading" class="loading">
                <div class="loading-spinner"></div>
                <span class="ml-4 text-white">正在加载统计监控数据...</span>
            </div>

            <!-- 错误信息 -->
            <div id="error-message" class="hidden bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded-lg mb-6">
                <div class="flex items-center">
                    <span class="text-red-400">⚠️</span>
                    <span class="ml-2" id="error-text">加载失败</span>
                    <button id="retry-btn" class="ml-4 px-3 py-1 bg-red-700 hover:bg-red-600 rounded text-sm">
                        重试
                    </button>
                </div>
            </div>

            <!-- 统计内容 -->
            <div id="stats-content" class="hidden">
                <!-- 实验信息头部 -->
                <div id="experiment-header" class="bg-gray-800 rounded-lg p-6 mb-8 border border-gray-700">
                    <div class="flex items-center justify-between">
                        <div>
                            <h1 class="text-2xl font-bold text-white mb-2" id="experiment-name">实验名称</h1>
                            <div class="flex items-center flex-wrap gap-x-4 gap-y-1 text-sm text-gray-400">
                                <span id="experiment-id">ID: --</span>
                                <span id="experiment-mode">模式: --</span>
                                <span id="experiment-window">窗口: --</span>
                                <span id="experiment-token-universe" class="text-gray-500"></span>
                            </div>
                        </div>
                        <div class="flex items-center space-x-4">
                            <a id="link-back" href="/experiments" class="px-4 py-2 bg-gray-600 hover:bg-gray-700 rounded-md text-sm font-medium text-white transition-colors">
                                ← 返回实验面板
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 警示条（查询截断/平台失败/窗口 clamp） -->
                <div id="warnings-bar" class="hidden bg-yellow-900 border border-yellow-700 text-yellow-200 px-4 py-3 rounded-lg mb-6 text-sm"></div>

                <!-- 汇总统计 -->
                <div id="summary-cards" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8"></div>

                <!-- 控制区：粒度 + 平台 -->
                <div class="bg-gray-800 rounded-lg p-4 mb-8 border border-gray-700">
                    <div class="flex flex-wrap gap-6 items-center justify-between">
                        <div class="flex flex-wrap gap-6 items-center">
                            <div>
                                <label for="granularity-select" class="block text-sm font-medium text-gray-300 mb-2">时间粒度</label>
                                <select id="granularity-select" class="px-3 py-2 bg-gray-700 border border-gray-700 rounded-md text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="1" selected>1 小时</option>
                                    <option value="4">4 小时</option>
                                    <option value="24">1 天</option>
                                </select>
                            </div>
                            <div>
                                <span class="block text-sm font-medium text-gray-300 mb-2">平台</span>
                                <div id="platform-checkboxes" class="flex gap-4 items-center"></div>
                            </div>
                        </div>
                        <div class="text-xs text-gray-500 leading-relaxed">
                            热度 = 新票数 + <span id="grad-weight-label">5</span> × 毕业数（按平台分档阈值）<br>
                            毕业双口径：大盘 = 窗口内平台毕业总数；交集 = 其中本实验发现过的票
                        </div>
                    </div>
                </div>

                <!-- 图表 -->
                <div class="bg-gray-800 rounded-lg p-6 mb-8 border border-gray-700">
                    <h2 class="text-lg font-semibold text-white mb-4">每小时新票与毕业（<span id="chart-gran-label">1 小时</span>）</h2>
                    <div class="chart-container">
                        <canvas id="hourly-chart"></canvas>
                    </div>
                </div>

                <!-- 明细表格 -->
                <div class="bg-gray-800 rounded-lg border border-gray-700">
                    <div class="p-4 border-b border-gray-700">
                        <h2 class="text-lg font-semibold text-white">分时明细</h2>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead class="bg-gray-700">
                                <tr id="table-head-row"></tr>
                            </thead>
                            <tbody id="stats-table-body" class="divide-y divide-gray-700"></tbody>
                        </table>
                    </div>
                </div>

                <!-- 空状态 -->
                <div id="empty-state" class="hidden text-center py-12">
                    <div class="text-gray-400 mb-4">
                        <svg class="w-24 h-24 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                        </svg>
                    </div>
                    <h3 class="text-xl font-semibold text-gray-400 mb-2">暂无统计数据</h3>
                    <p class="text-gray-500" id="empty-state-text">该实验窗口内未发现任何新票</p>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/simple-init.js?v=4.0"></script>
    <script src="/static/js/experiment_hourly_stats.js?v=1.0"></script>
</body>
</html>
